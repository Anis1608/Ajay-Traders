apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ajay-traders-ingress
  namespace: student-24010988a
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - 24010988a.imcc.skilli.in
      secretName: student-app-tls
  rules:
    - host: 24010988a.imcc.skilli.in
      http:
        paths:
          # 1. API Requests -> Backend Service
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000

          # 2. Frontend UI -> Frontend Service
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
